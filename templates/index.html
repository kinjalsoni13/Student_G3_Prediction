<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #eef6ff;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .result p {
            font-size: 25px;
            font-weight: bold;
            color: #222;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Grade Predictor</h1>
    <p class="subtitle">
        Predict a student's final grade using Machine Learning
    </p>

    <form action="/predict" method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" min="15" max="25" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="sex" required>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>School</label>
                <select name="school">
                    <option value="GP">GP</option>
                    <option value="MS">MS</option>
                </select>
            </div>

            <div class="form-group">
                <label>Study Time</label>
                <input type="number" name="studytime" min="1" max="4" required>
            </div>

            <div class="form-group">
                <label>Failures</label>
                <input type="number" name="failures" min="0" max="4" required>
            </div>

            <div class="form-group">
                <label>Absences</label>
                <input type="number" name="absences" min="0" max="100" required>
            </div>

            <div class="form-group">
                <label>G1 (First Period Grade)</label>
                <input type="number" name="G1" min="0" max="20" required>
            </div>

            <div class="form-group">
                <label>G2 (Second Period Grade)</label>
                <input type="number" name="G2" min="0" max="20" required>
            </div>

        </div>

        <button type="submit">Predict Final Grade</button>

    </form>

    {% if prediction %}
    <div class="result">
        <h2>Predicted Final Grade (G3)</h2>
        <p>{{ prediction }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
